---
- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb > 0
  changed_when: true

- name: Keep swap off across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "overlay\nbr_netfilter\n"
    mode: "0644"

- name: Kernel settings for pod networking
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

- name: Install apt prerequisites
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, python3-debian]
    state: present
    update_cache: true

# Kubernetes >= 1.36 needs containerd 2.x; Ubuntu's own package is 1.7.
- name: Add Docker's apt repository (for containerd.io)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install containerd
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

# containerd.io ships a config with the CRI plugin disabled; replace it with
# the full default config, switched to the systemd cgroup driver.
- name: Render containerd's default config
  ansible.builtin.command: containerd config default
  register: k8s_containerd_default
  changed_when: false

- name: Check the default config has a cgroup driver setting
  ansible.builtin.assert:
    that: k8s_containerd_default.stdout is search('SystemdCgroup = false')
    fail_msg: "containerd's default config has no 'SystemdCgroup = false' line; this containerd version needs a different config edit."

- name: Write containerd config with the systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ k8s_containerd_default.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
    mode: "0644"
  notify: Restart containerd

- name: Apply containerd config before kubelet starts
  ansible.builtin.meta: flush_handlers

- name: Add the Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    state: present

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true

- name: Hold Kubernetes packages at this version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Pin kubelet to the fixed IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ static_ip }}\n"
    mode: "0644"
  notify: Restart kubelet

- name: Enable kubelet
  ansible.builtin.service:
    name: kubelet
    enabled: true
